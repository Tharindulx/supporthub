server:
  port: ${PORT:8082}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/supporthub}
    username: ${DB_USER:supporthub}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true
  flyway:
    enabled: true
supporthub:
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
