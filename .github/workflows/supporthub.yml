name: SupportHub checks
on:
  push:
    paths: ['**']
  pull_request:
    paths: ['**']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: supporthub_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test-only-password
          MYSQL_ROOT_PASSWORD: test-only-root-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build Angular
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Package UI and test H2
        working-directory: .
        run: |
          mkdir -p backend/src/main/resources/static
          cp -R frontend/dist/supporthub/browser/. backend/src/main/resources/static/
          cd backend
          mvn -B --no-transfer-progress verify
      - name: Test MySQL
        working-directory: backend
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/supporthub_test?allowPublicKeyRetrieval=true&useSSL=false
          TEST_DB_USER: test_user
          TEST_DB_PASSWORD: test-only-password
        run: mvn -B --no-transfer-progress test
      - uses: actions/upload-artifact@v4
        with:
          name: supporthub
          path: backend/target/supporthub-1.0.0.jar
